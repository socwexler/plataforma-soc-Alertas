<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- La plantilla Word usa nombres de familia como "Lato Bold"; se mapean a Lato con el peso correcto -->
<fontconfig>
  <match target="pattern">
    <test name="family"><string>Lato Bold</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Lato</string></edit>
    <edit name="weight" mode="assign"><const>bold</const></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Lato Bold Italic</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Lato</string></edit>
    <edit name="weight" mode="assign"><const>bold</const></edit>
    <edit name="slant" mode="assign"><const>italic</const></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Lato Italic</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Lato</string></edit>
    <edit name="slant" mode="assign"><const>italic</const></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Lato Semibold Italic</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Lato</string></edit>
    <edit name="weight" mode="assign"><const>bold</const></edit>
    <edit name="slant" mode="assign"><const>italic</const></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Montserrat Bold</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Montserrat</string></edit>
    <edit name="weight" mode="assign"><const>bold</const></edit>
  </match>
</fontconfig>
